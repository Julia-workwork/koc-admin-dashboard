name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        env:
          KOC_APPS_SCRIPT_URL: ${{ secrets.KOC_APPS_SCRIPT_URL }}
        run: |
          mkdir -p dist
          cp -R static/* dist/
          cp -R lib dist/lib
          if [ -n "$KOC_APPS_SCRIPT_URL" ]; then
            cat > dist/config.js <<EOF
          export const KOC_CONFIG = {
            apiMode: "apps-script",
            appsScriptUrl: "$KOC_APPS_SCRIPT_URL",
          };
          EOF
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
